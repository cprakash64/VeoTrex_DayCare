name: veotrex-childcare
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: veotrex
      POSTGRES_USER: veotrex
      POSTGRES_PASSWORD: veotrex_local_only
    ports:
      - "${VEOTREX_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veotrex -d veotrex"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - veotrex-postgres:/var/lib/postgresql/data

volumes:
  veotrex-postgres:
