# VeoTrex daycare.veotrex.com - final HTTPS block for the Hostinger VPS.
#
# Install as /etc/nginx/sites-available/zz-veotrex-daycare (replacing the HTTP bootstrap file)
# AFTER certbot has issued the certificate. The "zz-" prefix keeps this file last in the
# alphabetical sites-enabled glob, so it never becomes the default for :80 or :443.
#
# The certificate paths below are configuration references only. No key material is read,
# copied, or committed by this repository.
#
# Target ingress: nginx 1.24.0 (Ubuntu 24.04). Directives introduced after that version
# must not appear here - the host fails `nginx -t` rather than degrading gracefully.

server {
    listen 80;
    server_name daycare.veotrex.com;

    # Keep the ACME path reachable over HTTP so renewals continue to validate.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else moves to HTTPS. Only this hostname is affected.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 is requested on the listen directive, not by the standalone `http2 on;` directive:
    # that form is nginx >= 1.25.1 and this deployment targets nginx 1.24.0, where it is an
    # unknown directive and `nginx -t` fails outright. Every other site on the host uses this form.
    listen 443 ssl http2;
    # Exactly one host. NEVER default_server, never a wildcard.
    server_name daycare.veotrex.com;

    ssl_certificate /etc/letsencrypt/live/daycare.veotrex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daycare.veotrex.com/privkey.pem;
    # certbot's shared options file, already used by fixcad, xpertapply and thecadviewer.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    # HSTS belongs here and only here - the certificate now exists. No preload directive: that is
    # effectively irreversible and should not be committed to on a staging hostname.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Content-Security-Policy intentionally omitted; see daycare-http.conf.

    # Diagnostic endpoints stay private.
    location ^~ /health/ {
        return 404;
    }

    # --- API ------------------------------------------------------------------------------------
    # No trailing slash on proxy_pass: the /v1 prefix must survive to the application.
    location /v1/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 20s;

        client_max_body_size 128k;
    }

    # --- Web ------------------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;

        # No WebSocket upgrade handling: none is required by this application.
    }
}
