# VeoTrex daycare.veotrex.com - HTTP bootstrap block for the Hostinger VPS.
#
# Install as /etc/nginx/sites-available/zz-veotrex-daycare and symlink into sites-enabled.
# The "zz-" prefix matters: sites-enabled/* is globbed alphabetically, so this file loads LAST,
# after spendwize, thecadviewer, xpertapply and zz-cad-fixer. It therefore cannot displace the
# existing de-facto defaults (spendwize on :80, thecadviewer on :443).
#
# This is the pre-certificate state. After certbot issues a certificate, replace this file with
# daycare-https.conf. Nothing here touches any other domain.

server {
    listen 80;
    # Exactly one host. NEVER default_server, and never a wildcard: either would capture traffic
    # that currently belongs to the existing sites.
    server_name daycare.veotrex.com;

    # No upload feature exists in the web application, and the API bounds its own Ring bodies at
    # 64 KiB (webhook) and 1 KiB (token exchange). These are deliberately conservative.
    client_max_body_size 1m;

    # Safe on plain HTTP. HSTS is deliberately absent here - advertising it before a certificate
    # exists would pin browsers to an HTTPS endpoint that is not yet serving.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # No Content-Security-Policy: Next.js and Auth0 both need a policy tuned to their inline and
    # connect sources, and an untested CSP would break sign-in. Added deliberately, later.

    # Let's Encrypt HTTP-01 challenge. certbot's nginx authenticator injects its own handling,
    # but an explicit location keeps the intent visible and survives config replacement.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Diagnostic endpoints are never public. /health/ready opens a database connection and both
    # health routes echo service/version/environment. The API is only reachable under /v1/ anyway,
    # so this is defence in depth rather than the sole control.
    location ^~ /health/ {
        return 404;
    }

    # --- API: Ring token exchange and webhooks -------------------------------------------------
    # proxy_pass has NO trailing slash and NO URI part, so the full original path is preserved:
    #   /v1/providers/ring/webhooks -> http://127.0.0.1:8100/v1/providers/ring/webhooks
    # Adding a trailing slash here would strip the /v1 prefix and silently 404 every Ring call.
    location /v1/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ring callback URLs are derived from VEOTREX_PUBLIC_ORIGIN server-side, never from these
        # headers. They are set for logging and client-IP accuracy only.

        # Bounded. Ring requires a webhook response within 5 s; actual latency is measured during
        # deployment qualification, and these timeouts are an upper bound, not a substitute.
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 20s;

        client_max_body_size 128k;
    }

    # --- Web: account link page, devices page, Auth0 routes under /auth/ ------------------------
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;

        # No Upgrade/Connection headers: the application uses no WebSocket, SSE or socket.io, and
        # the API declares no websocket routes. Verified in source, not assumed.
    }
}
