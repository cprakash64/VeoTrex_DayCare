[project]
name = "veotrex-api"
version = "0.1.0"
description = "VeoTrex childcare control-plane API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.16.4",
  # Security-critical AEAD for the credential vault: declared explicitly rather than relied on as
  # a transitive dependency of pyjwt[crypto]. Already resolved at this exact version in uv.lock.
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  # [socks] pulls socksio, which HTTPX uses for SOCKS proxy support. Required only when
  # VEOTREX_RING_API_PROXY_URL points at a socks5 proxy; inert otherwise.
  "httpx[socks]==0.28.1",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "pyjwt[crypto]==2.13.0",
  "pyyaml==6.0.2",
  "sqlalchemy[asyncio]==2.0.43",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
veotrex-ring-readiness = "veotrex_api.ring_readiness:main"
veotrex-provision = "veotrex_api.provision_cli:main"
veotrex-db-runtime-role = "veotrex_api.runtime_role:main"
veotrex-ring-pending-expiry = "veotrex_api.ring_pending_expiry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/veotrex_api"]
