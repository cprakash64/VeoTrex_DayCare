[project]
name = "veotrex-api"
version = "0.1.0"
description = "VeoTrex childcare control-plane API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.16.4",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "pyjwt[crypto]==2.10.1",
  "pyyaml==6.0.2",
  "sqlalchemy[asyncio]==2.0.43",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
veotrex-provision = "veotrex_api.provision_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/veotrex_api"]
