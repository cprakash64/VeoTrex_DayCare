[project]
name = "veotrex-api"
version = "0.1.0"
description = "VeoTrex childcare control-plane API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.16.4",
  # Security-critical AEAD for the credential vault: declared explicitly rather than relied on as
  # a transitive dependency of pyjwt[crypto]. Already resolved at this exact version in uv.lock.
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  # [socks] pulls socksio, which HTTPX uses for SOCKS proxy support. Required only when
  # VEOTREX_RING_API_PROXY_URL points at a socks5 proxy; inert otherwise.
  "httpx[socks]==0.28.1",
  # Staff enrollment image validation (decode, orientation, canonical re-encode). Already
  # resolved at this exact version in uv.lock via the edge-agent qualification group.
  "pillow==12.3.0",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "pyjwt[crypto]==2.13.0",
  "pyyaml==6.0.2",
  "sqlalchemy[asyncio]==2.0.43",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
veotrex-ring-readiness = "veotrex_api.ring_readiness:main"
veotrex-provision = "veotrex_api.provision_cli:main"
veotrex-db-runtime-role = "veotrex_api.runtime_role:main"
veotrex-ring-pending-expiry = "veotrex_api.ring_pending_expiry:main"
veotrex-staff-recognition-package = "veotrex_api.staff_package:main"
veotrex-edge-credential = "veotrex_api.edge_credentials:main"

[tool.hatch.build.targets.wheel]
packages = ["src/veotrex_api"]

# Local face-recognition qualification only (V1-02B0). Deliberately a dependency GROUP and not
# a project dependency: the control-plane image builds with `uv sync --no-dev`, which installs
# no groups, so OpenCV never reaches staging or production - where the opencv_eval backend is
# refused anyway. CI installs it with --all-groups so the evaluation code is linted, typed and
# import-tested, but CI never needs a model weight.
[dependency-groups]
face-eval = [
  # numpy is imported directly by veotrex_api.face_opencv, so it is declared rather than
  # relied on as an OpenCV transitive. Same pin as the edge agent, one resolution for both.
  "numpy==2.4.6",
  # Headless: the control plane has no display stack and must not pull GTK/Qt/FFmpeg.
  # 4.x keeps the FaceDetectorYN / FaceRecognizerSF API the audited zoo weights pair with.
  "opencv-python-headless==4.14.0.94",
]
