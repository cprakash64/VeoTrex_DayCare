title = "VeoTrex secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Generated artifacts and placeholder-only example configuration"
regexTarget = "line"
# No credential regex is allowlisted. The previous entry pinned a literal development database
# password, which both preserved that value in a public repository and would have suppressed
# detection of it. The password was removed from source (compose now reads POSTGRES_PASSWORD_FILE
# from a git-ignored local secret), and infra/local/compose.yaml is deliberately no longer
# path-allowlisted so a re-added literal is reported rather than excused.
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)\.next/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''(^|/)\.pytest_cache/''',
  '''(^|/)\.ruff_cache/''',
  '''(^|/)htmlcov/''',
]
