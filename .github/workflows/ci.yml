name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Ephemeral per-job PostgreSQL server: a separate cluster from any development data,
      # which is what the destructive database suite requires (roles are cluster-wide).
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: veotrex_test
          POSTGRES_USER: veotrex_test
          # Supplied by a repository secret. No database password is committed; if the secret is
          # absent the service fails to start rather than falling back to a known value.
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports: ["127.0.0.1:55433:5432"]
        options: >-
          --health-cmd "pg_isready -U veotrex_test -d veotrex_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      VEOTREX_ENVIRONMENT: ci
      VEOTREX_APP_VERSION: 0.1.0-ci
      VEOTREX_TEST_DATABASE_URL: postgresql+psycopg://veotrex_test:${{ secrets.CI_POSTGRES_PASSWORD }}@127.0.0.1:55433/veotrex_test
      VEOTREX_EDGE_NODE_ID: 00000000-0000-0000-0000-000000000001
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --all-packages --all-groups --locked
      - run: uv run --all-packages ruff format --check .
      - run: uv run --all-packages ruff check .
      - run: uv run --all-packages mypy
      # --all-packages, never --package: the latter re-syncs the shared workspace venv down to a
      # single member and uninstalls the other member's dependencies.
      - run: uv run --all-packages alembic -c apps/api/alembic.ini upgrade head
        env:
          VEOTREX_DATABASE_URL: ${{ env.VEOTREX_TEST_DATABASE_URL }}
      - run: uv run --all-packages alembic -c apps/api/alembic.ini check
        env:
          VEOTREX_DATABASE_URL: ${{ env.VEOTREX_TEST_DATABASE_URL }}
      - run: uv run --all-packages pytest --cov=veotrex_api --cov=veotrex_edge_agent --cov-report=term-missing

  # The unit suite runs under `uv run` on the runner and never executes the deployed image, so a
  # virtualenv whose absolute paths point at the BUILDER stage passed every check and still could
  # not start: console-script shebangs named /build/.venv/bin/python, and the editable install
  # recorded /build/apps/api/src. Both were found during the first real deployment, not by CI.
  # This job builds the control-plane image and runs things inside it.
  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/staging/Dockerfile.api -t veotrex-api-smoke .
      - name: Console scripts exec and the ASGI app imports, inside the runtime image
        env:
          # Synthetic, non-secret: Settings requires these at import time. The placeholder follows
          # the repository REPLACE_WITH_* convention so the credential scan still passes.
          SMOKE_DSN: postgresql+psycopg://veotrex:REPLACE_WITH_SMOKE_PASSWORD@postgres:5432/veotrex
        run: |
          docker run --rm --entrypoint sh \
            -e VEOTREX_ENVIRONMENT=ci \
            -e VEOTREX_APP_VERSION=0.0.0-smoke \
            -e VEOTREX_DATABASE_URL="$SMOKE_DSN" \
            veotrex-api-smoke -c '
            set -eu
            alembic --version
            uvicorn --version
            command -v veotrex-ring-readiness
            command -v veotrex-provision
            command -v veotrex-db-runtime-role
            command -v veotrex-ring-pending-expiry
            python -c "import veotrex_api, veotrex_api.main"
            if grep -rl "/build" /app/.venv/lib/python3.12/site-packages/*.pth 2>/dev/null; then
              echo "builder-only path leaked into the virtualenv"; exit 1
            fi
            if head -1 /app/.venv/bin/alembic | grep -q "/build"; then
              echo "console-script shebang points at the builder stage"; exit 1
            fi
          '
      - run: docker build -f infra/staging/Dockerfile.web -t veotrex-web-smoke .

  frontend:
    runs-on: ubuntu-latest
    env:
      AUTH0_DOMAIN: https://ci-auth.invalid
      AUTH0_CLIENT_ID: ci-placeholder-client
      AUTH0_CLIENT_SECRET: ci-placeholder-not-a-secret
      AUTH0_SECRET: ci-placeholder-session-key-with-more-than-32-characters
      AUTH0_AUDIENCE: https://ci-api.invalid
      APP_BASE_URL: http://localhost:3000
      VEOTREX_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.19.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:lint
      - run: pnpm web:typecheck
      - run: pnpm web:test
      - run: pnpm --dir apps/web build

  secrets:
    runs-on: ubuntu-latest
    # The workflow-level `contents: read` sets every other scope to none. On a
    # pull_request event gitleaks-action reads GET /pulls/{n}/commits to derive the
    # scan range, and that call is not error-handled, so it needs pull-requests
    # read. Posting inline findings would need write, but the action already
    # catches a failure there and warns; the scan verdict does not depend on it.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # v3 is the Node 24 runtime release - Node 20 left GitHub-hosted runners on
      # 2026-09-16. Inputs, outputs and behaviour are identical to v2.
      #
      # GITHUB_TOKEN is the token GitHub generates per run; nothing is stored. Without
      # it the action exits before scanning anything on a pull_request, which is not a
      # clean scan but a scan that never happened. No GITLEAKS_LICENSE: it is required
      # for organizations only, and this repository belongs to a user account.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
